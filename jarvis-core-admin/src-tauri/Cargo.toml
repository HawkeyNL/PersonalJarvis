[package]
name = "jarvis-core-admin"
version = "0.1.5"
description = "Linux graphical administration console for the Jarvis Home Node"
authors = ["PersonalJarvis contributors"]
edition = "2021"
rust-version = "1.82"

[lib]
name = "jarvis_core_admin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "jarvis-core-admin"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri"]
# Tauri uses this feature to select the embedded production assets instead of
# build.devUrl. Keep it out of the defaults so `tauri dev` continues to use
# Vite; production builders must opt in and are verified after compilation.
custom-protocol = ["desktop", "tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [], optional = true }
thiserror = "2"
wait-timeout = "0.2"

# Keep this Tauri application independent from the server Cargo workspace.
[workspace]
