[package]
name = "jarvis-api"
version = "0.1.35"
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
# Real STT (whisper.cpp). Requires cmake + a C++ toolchain. Run the backend with
# `cargo run -p jarvis-api --features speech-whisper` and set JARVIS_SPEECH_*.
speech-whisper = ["jarvis-speech/whisper"]

[lib]
name = "jarvis_api"
path = "src/lib.rs"

[[bin]]
name = "jarvis-api"
path = "src/main.rs"

[[bin]]
name = "jarvis-claude-worker"
path = "src/bin/jarvis-claude-worker.rs"

[dependencies]
tokio.workspace = true
axum.workspace = true
tower-http.workspace = true
serde.workspace = true
serde_json.workspace = true
# APNs only speaks HTTP/2. Cargo unifies features, so every reqwest client in
# a build that links jarvis-api can now negotiate HTTP/2 over TLS (ALPN);
# plain-HTTP clients stay on HTTP/1.1. A client that must keep HTTP/1.1 over
# TLS has to call `http1_only()`. Server side, the same unification enables
# hyper-util's `http2`, so every `axum::serve` listener in jarvis-api (the API
# Unix socket and the loopback TCP listener) also accepts h2c with prior
# knowledge. Caddy must keep proxying with HTTP/1.1 upstream (its default;
# no `versions h2c`), see deploy/caddy/README.md.
reqwest = { workspace = true, features = ["http2"] }
async-trait = "0.1"
serde_bytes.workspace = true
anyhow.workspace = true
dotenvy.workspace = true
hex.workspace = true
uuid.workspace = true
tracing.workspace = true
jarvis-config.workspace = true
jarvis-client-core.workspace = true
jarvis-observability.workspace = true
jarvis-identity.workspace = true
jarvis-portfolio.workspace = true
jarvis-ibkr.workspace = true
jarvis-llm.workspace = true
jarvis-speech.workspace = true
jarvis-registry.workspace = true
jarvis-usage.workspace = true
jarvis-orchestrator.workspace = true
jarvis-agent.workspace = true
jarvis-selfdev.workspace = true
jarvis-store.workspace = true
jarvis-core.workspace = true
jarvis-privileged.workspace = true
jarvis-codex.workspace = true
jarvis-sandbox.workspace = true
jarvis-policy.workspace = true
jarvis-onchain.workspace = true
jarvis-market-data.workspace = true
rust_decimal.workspace = true
rand.workspace = true
time.workspace = true
sha2.workspace = true
semver.workspace = true
tokio-util.workspace = true
url.workspace = true
libc = "0.2"
tempfile = "3"
surrealdb.workspace = true
# ES256 provider tokens for APNs (already in the tree through surrealdb).
jsonwebtoken = "9.3"

[dev-dependencies]
# Generates a throwaway P-256 key for the APNs tests (already in the tree).
ring = "0.17"
async-trait = "0.1"
tokio-tungstenite = "0.29"
futures-util = "0.3"
tower = { version = "0.5", features = ["util"] }
ed25519-dalek.workspace = true
rand.workspace = true
