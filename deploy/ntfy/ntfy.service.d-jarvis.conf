# Install as /etc/systemd/system/ntfy.service.d/jarvis.conf on top of the
# ntfy package's own ntfy.service (check `systemctl cat ntfy` shows
# User=ntfy). server.yml keeps the listener on loopback; this drop-in only
# narrows what the process can touch.
[Service]
# Port 2586 needs no privilege: drop the package's bind capability.
AmbientCapabilities=
CapabilityBoundingSet=
NoNewPrivileges=true
# The only writable paths are the auth database and the message cache.
ProtectSystem=strict
StateDirectory=ntfy
StateDirectoryMode=0700
CacheDirectory=ntfy
CacheDirectoryMode=0700
UMask=0077
ProtectHome=true
PrivateTmp=true
PrivateDevices=true
ProtectClock=true
ProtectHostname=true
ProtectKernelLogs=true
ProtectKernelModules=true
ProtectKernelTunables=true
ProtectControlGroups=true
RestrictNamespaces=true
RestrictRealtime=true
RestrictSUIDSGID=true
LockPersonality=true
MemoryDenyWriteExecute=true
SystemCallArchitectures=native
# Outbound HTTPS to the iOS upstream (ntfy.sh) still needs IP sockets.
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
InaccessiblePaths=-/etc/jarvis -/var/lib/jarvis
MemoryMax=256M
TasksMax=256
