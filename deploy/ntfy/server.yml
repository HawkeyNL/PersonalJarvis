# ntfy server for Jarvis owner notifications (docs/NOTIFICATIONS.md).
# Install as /etc/ntfy/server.yml (root:ntfy 0640) and replace the base-url
# placeholder with the public ntfy hostname that Caddy serves.
base-url: "https://ntfy.example.com"
# Loopback only: Caddy terminates TLS on 443 and Core publishes locally.
listen-http: "127.0.0.1:2586"
behind-proxy: true

# Short message cache so an offline phone, and the iOS app (which fetches the
# message after the upstream poll request), can still collect it.
cache-file: "/var/cache/ntfy/cache.db"
cache-duration: "12h"

# Nothing is readable or writable without an account and an explicit grant.
auth-file: "/var/lib/ntfy/user.db"
auth-default-access: "deny-all"
enable-signup: false
# Web-app login only; the phone apps authenticate without it. Enable only if
# a client turns out to need it.
enable-login: false

# iOS only: with this set, every published message is announced to ntfy.sh
# as a poll request (message id and a hash of the topic URL), which relays it
# through APNs; the message text stays on this server. ntfy.sh still sees the
# Home Node's IP address and the timing, and Apple sees the timing. Remove
# this line when no iPhone uses the ntfy app.
upstream-base-url: "https://ntfy.sh"

# No attachments (attachment-cache-dir stays unset) and no web app; the
# phone apps use the API directly.
web-root: "disable"
log-level: "info"
