# Install as /etc/systemd/system/caddy.service.d/jarvis-admin.conf.
# Provides /run/caddy for the admin API socket set in the Caddyfile's global
# options. caddy:caddy 0700: only Caddy and root can reach the socket. systemd
# removes the directory when Caddy stops, so no stale socket survives a restart.
[Service]
RuntimeDirectory=caddy
RuntimeDirectoryMode=0700
