[package]
name = "jarvis-ibkr"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
tokio = { workspace = true }
rust_decimal.workspace = true
rand.workspace = true
sha2.workspace = true
hex.workspace = true
zeroize = "1"
# OAuth 1.0a: RSA for the access-token secret and the LST request signature,
# DER/PEM for the DH parameters, HMAC-SHA1/SHA256 for the session token.
rsa = { version = "0.9", features = ["sha2"] }
der = { version = "0.7", features = ["pem"] }
hmac = "0.12"
sha1 = "0.10"
base64 = "0.22"
percent-encoding = "2"

[dev-dependencies]
tempfile = "3"
