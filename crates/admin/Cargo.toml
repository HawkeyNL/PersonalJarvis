[package]
name = "jarvis-admin"
version = "0.1.3"
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "jarvis"
path = "src/main.rs"

[features]
# Fixture-only rootless visual preview. This feature grants no administrative
# capability and is intentionally absent from release builds.
tui-preview = []

[dependencies]
anyhow.workspace = true
clap.workspace = true
fs2.workspace = true
reqwest.workspace = true
ratatui.workspace = true
crossterm.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile = "3"
