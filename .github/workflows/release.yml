name: Release Jarvis Core

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-validation:
    name: Rust validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all
      - name: SurrealDB persistence security tests
        run: |
          docker run --detach --rm --name jarvis-surreal-test -p 127.0.0.1:8000:8000 \
            surrealdb/surrealdb:v2.6.5 start --bind 0.0.0.0:8000 --user root --pass test-root-password memory
          for attempt in $(seq 1 20); do
            curl --fail --silent http://127.0.0.1:8000/health && break
            sleep 1
          done
          JARVIS_SURREAL_TEST_ENDPOINT=127.0.0.1:8000 JARVIS_SURREAL_TEST_USER=root JARVIS_SURREAL_TEST_PASS=test-root-password cargo test -p jarvis-identity surreal::tests::challenge_login_cannot_be_replayed -- --ignored
          JARVIS_SURREAL_TEST_ENDPOINT=127.0.0.1:8000 JARVIS_SURREAL_TEST_USER=root JARVIS_SURREAL_TEST_PASS=test-root-password cargo test -p jarvis-portfolio surreal::tests::preserves_decimal_holdings_and_owner_scope -- --ignored
          JARVIS_SURREAL_TEST_ENDPOINT=127.0.0.1:8000 JARVIS_SURREAL_TEST_USER=root JARVIS_SURREAL_TEST_PASS=test-root-password cargo test -p jarvis-api --test surreal_api -- --ignored

  deployment-security:
    name: Deployment and sandbox security fixtures
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.0"
          cache: false
      - run: bash scripts/ci/verify-deployment-security.sh

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.1
      - run: cargo install cargo-audit --locked
      - run: test "$(date -u +%F)" \< "2026-10-01"
      - run: cargo audit

  release:
    name: Build and test Linux release candidate
    needs: [rust-validation, deployment-security, dependency-audit]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: actions/setup-node@v5
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: jarvis-core-admin/package-lock.json
      - uses: Swatinem/rust-cache@v2
      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libayatana-appindicator3-dev libdbus-1-dev libssl-dev librsvg2-dev \
            libwebkit2gtk-4.1-dev libxdo-dev pkg-config
      - name: Record canonical builder
        run: |
          cat /etc/os-release
          rustc -Vv
          cargo -Vv
          cc --version
      - name: Build release candidate once
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REVISION: ${{ github.sha }}
          SOURCE_DATE_EPOCH: "0"
        run: bash scripts/release/build-linux.sh stage "$RELEASE_TAG" "$RELEASE_REVISION"
      - name: PTY smoke test exact staged admin binary
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: sudo -n python3 scripts/ci/test-admin-tui-pty.py "dist/candidate/jarvis-core-$RELEASE_TAG/jarvis"
      - name: Smoke test exact staged Core Admin App binary
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          candidate="dist/candidate/jarvis-core-$RELEASE_TAG"
          test "$("$candidate/jarvis-core-admin" --component-version)" = \
            "$(jq -r .components.core_admin "$candidate/release.json")"
          test "$("$candidate/jarvis-core-admin" --frontend-mode)" = production
      - name: Package tested candidate bytes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REVISION: ${{ github.sha }}
          SOURCE_DATE_EPOCH: "0"
        run: bash scripts/release/build-linux.sh package "$RELEASE_TAG" "$RELEASE_REVISION"
      - name: Upload Home Node acceptance candidate
        uses: actions/upload-artifact@v6
        with:
          name: jarvis-home-node-candidate-${{ github.ref_name }}
          path: |
            dist/jarvis-core-${{ github.ref_name }}-linux-x86_64.tar.gz
            dist/jarvis-core-${{ github.ref_name }}-linux-x86_64.tar.gz.sha256
            dist/jarvis-core-${{ github.ref_name }}-components.json
            dist/jarvis-core-${{ github.ref_name }}-components.json.sha256
          if-no-files-found: error
          retention-days: 7
