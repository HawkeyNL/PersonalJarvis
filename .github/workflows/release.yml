name: Release Jarvis Core

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-validation:
    name: Rust validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all
      - name: SurrealDB persistence security tests
        run: |
          docker run --detach --rm --name jarvis-surreal-test -p 127.0.0.1:8000:8000 \
            surrealdb/surrealdb:v2.6.5 start --bind 0.0.0.0:8000 --user root --pass test-root-password memory
          for attempt in $(seq 1 20); do
            curl --fail --silent http://127.0.0.1:8000/health && break
            sleep 1
          done
          JARVIS_SURREAL_TEST_ENDPOINT=127.0.0.1:8000 JARVIS_SURREAL_TEST_USER=root JARVIS_SURREAL_TEST_PASS=test-root-password cargo test -p jarvis-identity surreal::tests::challenge_login_cannot_be_replayed -- --ignored
          JARVIS_SURREAL_TEST_ENDPOINT=127.0.0.1:8000 JARVIS_SURREAL_TEST_USER=root JARVIS_SURREAL_TEST_PASS=test-root-password cargo test -p jarvis-portfolio surreal::tests::preserves_decimal_holdings_and_owner_scope -- --ignored
          JARVIS_SURREAL_TEST_ENDPOINT=127.0.0.1:8000 JARVIS_SURREAL_TEST_USER=root JARVIS_SURREAL_TEST_PASS=test-root-password cargo test -p jarvis-api --test surreal_api -- --ignored

  deployment-security:
    name: Deployment and sandbox security fixtures
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
      - run: bash scripts/ci/verify-deployment-security.sh

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: test "$(date -u +%F)" \< "2026-10-01"
      - run: cargo audit

  release:
    name: Build and publish Linux release
    needs: [rust-validation, deployment-security, dependency-audit]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release artifact
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REVISION: ${{ github.sha }}
          SOURCE_DATE_EPOCH: "0"
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "release tag must use stable vMAJOR.MINOR.PATCH form" >&2
            exit 1
          }
          cargo build --locked --release -p jarvis-api --bin jarvis-api
          cargo build --locked --release -p jarvis-api --bin jarvis-config-broker
          cargo build --locked --release -p jarvis-api --bin jarvis-codex-broker
          cargo build --locked --release -p jarvis-core --bin jarvis-agent-bundle
          cargo build --locked --release -p jarvis-admin --bin jarvis
          staging=$(mktemp -d)
          trap 'rm -rf "$staging"' EXIT
          release_dir="$staging/jarvis-core-$RELEASE_TAG"
          mkdir -p "$release_dir"
          install -m 0755 target/release/jarvis-api "$release_dir/jarvis-api"
          install -m 0755 target/release/jarvis-config-broker "$release_dir/jarvis-config-broker"
          install -m 0755 target/release/jarvis-codex-broker "$release_dir/jarvis-codex-broker"
          install -m 0755 target/release/jarvis-agent-bundle "$release_dir/jarvis-agent-bundle"
          install -m 0755 target/release/jarvis "$release_dir/jarvis"
          install -m 0755 deploy/systemd/update-core-release.sh "$release_dir/update-core-release"
          schema_manifest="$staging/schema.sha256"
          while IFS= read -r schema; do sha256sum "schema/surreal/$schema"; done < <(find schema/surreal -type f -name '*.surql' -printf '%P\n' | LC_ALL=C sort) > "$schema_manifest"
          schema_sha256=$(sha256sum "$schema_manifest" | awk '{print $1}')
          jq -n --arg tag "$RELEASE_TAG" --arg revision "$RELEASE_REVISION" --arg schema_sha256 "$schema_sha256" '{tag: $tag, revision: $revision, schema_sha256: $schema_sha256}' > "$release_dir/release.json"
          mkdir -p dist
          artifact="jarvis-core-$RELEASE_TAG-linux-x86_64.tar.gz"
          tar --sort=name --mtime="@$SOURCE_DATE_EPOCH" --owner=0 --group=0 --numeric-owner -C "$staging" -czf "dist/$artifact" "jarvis-core-$RELEASE_TAG"
          (cd dist && sha256sum "$artifact" > "$artifact.sha256")
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" "dist/jarvis-core-$RELEASE_TAG-linux-x86_64.tar.gz" "dist/jarvis-core-$RELEASE_TAG-linux-x86_64.tar.gz.sha256" --target "$GITHUB_SHA" --title "Jarvis Core $RELEASE_TAG" --generate-notes
