name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  deployment-privacy:
    name: Deployment identifier privacy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/ci/check-deployment-privacy.py
      - run: python3 scripts/ci/test-deployment-privacy.py

  rust-validation:
    name: Rust — fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --all
      - name: Rootless Update Center PTY lifecycle
        run: |
          cargo build -p jarvis-admin --features tui-preview
          python3 scripts/ci/test-admin-tui-pty.py target/debug/jarvis \
            --fixture-preview --preview-scenario home
      - name: SurrealDB persistence security tests
        run: |
          docker run --detach --rm --name jarvis-surreal-test -p 127.0.0.1:8000:8000 \
            surrealdb/surrealdb:v2.6.5 start --bind 0.0.0.0:8000 --user root --pass test-root-password memory
          for attempt in $(seq 1 20); do
            curl --fail --silent http://127.0.0.1:8000/health && break
            sleep 1
          done
          JARVIS_SURREAL_TEST_ENDPOINT=127.0.0.1:8000 JARVIS_SURREAL_TEST_USER=root JARVIS_SURREAL_TEST_PASS=test-root-password cargo test -p jarvis-identity surreal::tests::challenge_login_cannot_be_replayed -- --ignored
          JARVIS_SURREAL_TEST_ENDPOINT=127.0.0.1:8000 JARVIS_SURREAL_TEST_USER=root JARVIS_SURREAL_TEST_PASS=test-root-password cargo test -p jarvis-portfolio surreal::tests::preserves_decimal_holdings_and_owner_scope -- --ignored
          JARVIS_SURREAL_TEST_ENDPOINT=127.0.0.1:8000 JARVIS_SURREAL_TEST_USER=root JARVIS_SURREAL_TEST_PASS=test-root-password cargo test -p jarvis-api --test surreal_api -- --ignored
      - name: Protected-input Core startup regression
        run: sudo env GITHUB_ACTIONS=true JARVIS_API_BINARY="$GITHUB_WORKSPACE/target/debug/jarvis-api" bash deploy/systemd/tests/test-core-startup-protected-inputs.sh

  deployment-security:
    name: Deployment and sandbox security fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.0"
          cache: false
      - name: Verify deployment and OpenSandbox boundaries
        run: bash scripts/ci/verify-deployment-security.sh

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Check dependency-exception expiry
        run: test "$(date -u +%F)" \< "2026-10-01"
      - run: cargo audit

  # Desktop CI lives in HawkeyNL/PersonalJarvisApp.
