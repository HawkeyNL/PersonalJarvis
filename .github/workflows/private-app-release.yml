name: Private Application Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Reviewed Jarvis application SemVer (without v)
        required: true
        type: string
      android_version_code:
        description: Monotonically increasing Android versionCode
        required: true
        type: string
      ios_build_number:
        description: Monotonically increasing App Store Connect build number
        required: true
        type: string

concurrency:
  group: private-application-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  PRIVATE_RELEASE_REPO: ${{ vars.PRIVATE_RELEASE_REPO }}

jobs:
  validate:
    name: Validate trusted application release
    if: github.repository == 'HawkeyNL/PersonalJarvis' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      released_at: ${{ steps.release.outputs.released_at }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Validate source and platform versions
        env:
          APP_VERSION: ${{ inputs.version }}
          ANDROID_VERSION_CODE: ${{ inputs.android_version_code }}
          IOS_BUILD_NUMBER: ${{ inputs.ios_build_number }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_SIGNING_PUBLIC_KEY }}
        run: |
          test -n "$PRIVATE_RELEASE_REPO" || { echo "PRIVATE_RELEASE_REPO repository variable is required" >&2; exit 2; }
          test -n "$TAURI_UPDATER_PUBLIC_KEY" || { echo "TAURI_SIGNING_PUBLIC_KEY repository variable is required" >&2; exit 2; }
          python3 jarvis-app/update-release/validate_versions.py \
            --version "$APP_VERSION" \
            --android-version-code "$ANDROID_VERSION_CODE" \
            --ios-build-number "$IOS_BUILD_NUMBER"
      - name: Record immutable release identity
        id: release
        env:
          APP_VERSION: ${{ inputs.version }}
        run: |
          echo "release_tag=app-v${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "released_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

  stage-private-release:
    name: Stage private release
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: private-app-release
    env:
      ANDROID_VERSION_CODE: ${{ inputs.android_version_code }}
      APP_VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ secrets.PRIVATE_RELEASE_REPO_TOKEN }}
      IOS_BUILD_NUMBER: ${{ inputs.ios_build_number }}
      RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Enforce monotonic private release versions
        run: |
          test -n "$GH_TOKEN" || { echo "PRIVATE_RELEASE_REPO_TOKEN is required" >&2; exit 2; }
          mkdir -p "$RUNNER_TEMP/previous"
          previous_tag=$(gh release list \
            --repo "$PRIVATE_RELEASE_REPO" \
            --exclude-drafts \
            --limit 1 \
            --json tagName \
            --jq '.[0].tagName // empty')
          if [[ -n "$previous_tag" ]]; then
            gh release download "$previous_tag" \
              --repo "$PRIVATE_RELEASE_REPO" \
              --pattern latest.json \
              --dir "$RUNNER_TEMP/previous"
            python3 jarvis-app/update-release/validate_previous_release.py \
              --manifest "$RUNNER_TEMP/previous/latest.json" \
              --version "$APP_VERSION" \
              --android-version-code "$ANDROID_VERSION_CODE" \
              --ios-build-number "$IOS_BUILD_NUMBER"
          fi
      - name: Create or resume matching private draft
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          test -n "$GH_TOKEN" || { echo "PRIVATE_RELEASE_REPO_TOKEN is required" >&2; exit 2; }
          if gh release view "$RELEASE_TAG" --repo "$PRIVATE_RELEASE_REPO" --json isDraft,body > "$RUNNER_TEMP/release.json" 2>/dev/null; then
            test "$(jq -r .isDraft "$RUNNER_TEMP/release.json")" = "true" || { echo "release tag is already published" >&2; exit 2; }
            jq -e --arg revision "$SOURCE_REVISION" '.body | contains("Source revision: " + $revision)' "$RUNNER_TEMP/release.json" >/dev/null || {
              echo "existing draft belongs to a different source revision" >&2
              exit 2
            }
          else
            gh release create "$RELEASE_TAG" \
              --repo "$PRIVATE_RELEASE_REPO" \
              --draft \
              --title "Jarvis application $RELEASE_TAG" \
              --notes "Private signed Jarvis application release. Source revision: $SOURCE_REVISION"
          fi

  desktop:
    name: Signed desktop — ${{ matrix.name }}
    needs: [validate, stage-private-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86_64
            os: windows-2022
            platform: windows
            architecture: x86_64
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - name: macOS arm64
            os: macos-15
            platform: macos
            architecture: arm64
            target: aarch64-apple-darwin
            bundles: app,dmg
          - name: Ubuntu x86_64
            os: ubuntu-24.04
            platform: linux
            architecture: x86_64
            target: x86_64-unknown-linux-gnu
            bundles: appimage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    environment: private-app-release
    env:
      APP_VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ secrets.PRIVATE_RELEASE_REPO_TOKEN }}
      JARVIS_TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_SIGNING_PUBLIC_KEY }}
      RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install Ubuntu packaging dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libdbus-1-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            pkg-config \
            wget
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: jarvis-app/package-lock.json
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: jarvis-app/src-tauri -> target
      - name: Verify release secret boundary
        shell: bash
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "TAURI_SIGNING_PRIVATE_KEY is required" >&2; exit 2; }
          test -n "$JARVIS_TAURI_UPDATER_PUBKEY" || { echo "TAURI_SIGNING_PUBLIC_KEY is required" >&2; exit 2; }
          test -n "$GH_TOKEN" || { echo "PRIVATE_RELEASE_REPO_TOKEN is required" >&2; exit 2; }
      - name: Install pinned dependencies
        working-directory: jarvis-app
        shell: bash
        run: |
          npm ci
          cargo fetch --manifest-path src-tauri/Cargo.toml --locked --target "${{ matrix.target }}"
      - name: Install ephemeral macOS Developer ID material
        if: matrix.platform == 'macos'
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          MACOS_NOTARY_API_ISSUER_ID: ${{ secrets.MACOS_NOTARY_API_ISSUER_ID }}
          MACOS_NOTARY_API_KEY_ID: ${{ secrets.MACOS_NOTARY_API_KEY_ID }}
          MACOS_NOTARY_API_PRIVATE_KEY_BASE64: ${{ secrets.MACOS_NOTARY_API_PRIVATE_KEY_BASE64 }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION }}
        run: |
          for value in MACOS_CERTIFICATE_P12_BASE64 MACOS_CERTIFICATE_PASSWORD MACOS_NOTARY_API_ISSUER_ID MACOS_NOTARY_API_KEY_ID MACOS_NOTARY_API_PRIVATE_KEY_BASE64 MACOS_SIGNING_IDENTITY; do
            test -n "${!value}" || { echo "$value is required" >&2; exit 2; }
          done
          keychain="$RUNNER_TEMP/jarvis-macos-release.keychain-db"
          keychain_password=$(uuidgen)
          certificate="$RUNNER_TEMP/jarvis-developer-id.p12"
          api_key="$RUNNER_TEMP/AuthKey_${MACOS_NOTARY_API_KEY_ID}.p8"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 -D > "$certificate"
          printf '%s' "$MACOS_NOTARY_API_PRIVATE_KEY_BASE64" | base64 -D > "$api_key"
          chmod 600 "$certificate" "$api_key"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" \
            -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain"
          security list-keychains -d user -s "$keychain"
          security find-identity -v -p codesigning "$keychain" | grep -Fq "$MACOS_SIGNING_IDENTITY"
          echo "JARVIS_MACOS_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_PATH=$api_key" >> "$GITHUB_ENV"
      - name: Build signed updater and installer
        if: matrix.platform != 'macos'
        working-directory: jarvis-app
        shell: bash
        run: >-
          npm run desktop:build --
          --target "${{ matrix.target }}"
          --bundles "${{ matrix.bundles }}"
          --ci
          --
          --locked
      - name: Build Developer ID signed and notarized macOS release
        if: matrix.platform == 'macos'
        working-directory: jarvis-app
        shell: bash
        env:
          APPLE_API_ISSUER: ${{ secrets.MACOS_NOTARY_API_ISSUER_ID }}
          APPLE_API_KEY: ${{ secrets.MACOS_NOTARY_API_KEY_ID }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION }}
        run: >-
          npm run desktop:build --
          --target "${{ matrix.target }}"
          --bundles "${{ matrix.bundles }}"
          --ci
          --
          --locked
      - name: Notarize and staple macOS disk image
        if: matrix.platform == 'macos'
        shell: bash
        env:
          MACOS_NOTARY_API_ISSUER_ID: ${{ secrets.MACOS_NOTARY_API_ISSUER_ID }}
          MACOS_NOTARY_API_KEY_ID: ${{ secrets.MACOS_NOTARY_API_KEY_ID }}
        run: |
          dmg=$(find "jarvis-app/src-tauri/target/${{ matrix.target }}/release/bundle/dmg" -maxdepth 1 -type f -name '*.dmg')
          test -n "$dmg" && test "$(printf '%s\n' "$dmg" | wc -l)" -eq 1 || { echo "expected exactly one macOS DMG" >&2; exit 2; }
          xcrun notarytool submit "$dmg" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$MACOS_NOTARY_API_KEY_ID" \
            --issuer "$MACOS_NOTARY_API_ISSUER_ID" \
            --wait
          xcrun stapler staple "$dmg"
      - name: Verify macOS OS trust and stapled notarization
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          app=$(find "jarvis-app/src-tauri/target/${{ matrix.target }}/release/bundle/macos" -maxdepth 1 -type d -name '*.app')
          dmg=$(find "jarvis-app/src-tauri/target/${{ matrix.target }}/release/bundle/dmg" -maxdepth 1 -type f -name '*.dmg')
          test -n "$app" && test "$(printf '%s\n' "$app" | wc -l)" -eq 1 || { echo "expected exactly one macOS app bundle" >&2; exit 2; }
          test -n "$dmg" && test "$(printf '%s\n' "$dmg" | wc -l)" -eq 1 || { echo "expected exactly one macOS DMG" >&2; exit 2; }
          codesign --verify --deep --strict --verbose=2 "$app"
          signing_details=$(codesign -d --verbose=4 "$app" 2>&1)
          grep -Fq 'Authority=Developer ID Application:' <<< "$signing_details"
          grep -Eq 'flags=.*runtime' <<< "$signing_details"
          xcrun stapler validate "$app"
          xcrun stapler validate "$dmg"
      - name: Collect canonical private assets
        shell: bash
        run: |
          python3 jarvis-app/update-release/collect_tauri.py \
            --bundle-root "jarvis-app/src-tauri/target/${{ matrix.target }}/release/bundle" \
            --output "$RUNNER_TEMP/private-assets" \
            --platform "${{ matrix.platform }}" \
            --version "$APP_VERSION"
      - name: Upload only to private draft release
        shell: bash
        run: gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/private-assets"/* --repo "$PRIVATE_RELEASE_REPO" --clobber
      - name: Remove ephemeral macOS signing material
        if: always() && matrix.platform == 'macos'
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/jarvis-macos-release.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/jarvis-developer-id.p12" "$RUNNER_TEMP"/AuthKey_*.p8

  android:
    name: Signed native Android APK and AAB
    needs: [validate, stage-private-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: private-app-release
    env:
      APP_VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ secrets.PRIVATE_RELEASE_REPO_TOKEN }}
      JARVIS_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
      JARVIS_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
      JARVIS_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
      JARVIS_ANDROID_VERSION_CODE: ${{ inputs.android_version_code }}
      RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
    defaults:
      run:
        working-directory: jarvis-android
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: |
            jarvis-android/*.gradle.kts
            jarvis-android/gradle/libs.versions.toml
            jarvis-android/gradle/wrapper/gradle-wrapper.properties
            jarvis-android/app/build.gradle.kts
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - name: Materialize ephemeral release keystore
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_RELEASE_KEYSTORE_BASE64" || { echo "ANDROID_RELEASE_KEYSTORE_BASE64 is required" >&2; exit 2; }
          test -n "$JARVIS_ANDROID_KEY_ALIAS" || { echo "ANDROID_RELEASE_KEY_ALIAS is required" >&2; exit 2; }
          test -n "$JARVIS_ANDROID_KEY_PASSWORD" || { echo "ANDROID_RELEASE_KEY_PASSWORD is required" >&2; exit 2; }
          test -n "$JARVIS_ANDROID_STORE_PASSWORD" || { echo "ANDROID_RELEASE_STORE_PASSWORD is required" >&2; exit 2; }
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/jarvis-release.jks"
          chmod 600 "$RUNNER_TEMP/jarvis-release.jks"
          echo "JARVIS_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/jarvis-release.jks" >> "$GITHUB_ENV"
      - name: Test, lint and build signed release packages
        run: ./gradlew testReleaseUnitTest lintRelease assembleRelease bundleRelease --no-daemon
      - name: Verify and collect signed Android packages
        run: |
          apk=$(find app/build/outputs/apk/release -type f -name '*.apk' ! -name '*unsigned*')
          test -n "$apk" && test "$(printf '%s\n' "$apk" | wc -l)" -eq 1 || { echo "expected exactly one signed release APK" >&2; exit 2; }
          aab=$(find app/build/outputs/bundle/release -type f -name '*.aab')
          test -n "$aab" && test "$(printf '%s\n' "$aab" | wc -l)" -eq 1 || { echo "expected exactly one signed release AAB" >&2; exit 2; }
          apksigner verify --verbose "$apk"
          fingerprint=$(apksigner verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr '[:upper:]' '[:lower:]')
          [[ "$fingerprint" =~ ^[0-9a-f]{64}$ ]] || { echo "APK signing certificate digest is unavailable" >&2; exit 2; }
          mkdir -p "$RUNNER_TEMP/private-assets"
          base="Jarvis_${APP_VERSION}_android_universal"
          cp "$apk" "$RUNNER_TEMP/private-assets/${base}.apk"
          cp "$aab" "$RUNNER_TEMP/private-assets/${base}.aab"
          printf '%s\n' "$fingerprint" > "$RUNNER_TEMP/private-assets/${base}.apk.cert-sha256"
      - name: Upload only to private draft release
        working-directory: ${{ github.workspace }}
        run: gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/private-assets"/* --repo "$PRIVATE_RELEASE_REPO" --clobber
      - name: Remove ephemeral keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/jarvis-release.jks"

  ios:
    name: Signed native iOS archive to TestFlight
    needs: [validate, stage-private-release]
    runs-on: macos-15
    timeout-minutes: 60
    environment: private-app-release
    env:
      APP_VERSION: ${{ inputs.version }}
      APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      GH_TOKEN: ${{ secrets.PRIVATE_RELEASE_REPO_TOKEN }}
      IOS_BUILD_NUMBER: ${{ inputs.ios_build_number }}
      RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
    defaults:
      run:
        working-directory: jarvis-ios
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install ephemeral Apple signing material
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_APP_STORE_PROVISIONING_PROFILE_BASE64 }}
          APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
        run: |
          for value in APPLE_CERTIFICATE_P12_BASE64 APPLE_PROVISIONING_PROFILE_BASE64 APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_API_ISSUER_ID APPLE_CERTIFICATE_PASSWORD APPLE_TEAM_ID; do
            test -n "${!value}" || { echo "$value is required" >&2; exit 2; }
          done
          KEYCHAIN_PATH="$RUNNER_TEMP/jarvis-release.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 -D > "$RUNNER_TEMP/distribution.p12"
          printf '%s' "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 -D > "$RUNNER_TEMP/profile.mobileprovision"
          printf '%s' "$APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64" | base64 -D > "$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/distribution.p12" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/Jarvis-CI.mobileprovision"
          echo "JARVIS_CI_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "JARVIS_PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "JARVIS_API_KEY_PATH=$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8" >> "$GITHUB_ENV"
      - name: Archive signed native iOS application
        run: |
          xcodebuild \
            -project Jarvis.xcodeproj \
            -scheme Jarvis \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Jarvis.xcarchive" \
            archive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$JARVIS_PROFILE_NAME" \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="$IOS_BUILD_NUMBER" \
            OTHER_CODE_SIGN_FLAGS="--keychain $JARVIS_CI_KEYCHAIN"
      - name: Upload archive to App Store Connect and TestFlight
        run: |
          EXPORT_OPTIONS="$RUNNER_TEMP/ExportOptions.plist"
          plutil -create xml1 "$EXPORT_OPTIONS"
          plutil -insert method -string app-store-connect "$EXPORT_OPTIONS"
          plutil -insert destination -string upload "$EXPORT_OPTIONS"
          plutil -insert signingStyle -string manual "$EXPORT_OPTIONS"
          plutil -insert teamID -string "$APPLE_TEAM_ID" "$EXPORT_OPTIONS"
          plutil -insert manageAppVersionAndBuildNumber -bool false "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c 'Add :provisioningProfiles dict' "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:com.hawkeynl.jarvis string $JARVIS_PROFILE_NAME" "$EXPORT_OPTIONS"
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/Jarvis.xcarchive" \
            -exportOptionsPlist "$EXPORT_OPTIONS" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$JARVIS_API_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_API_ISSUER_ID"
      - name: Record successful Apple distribution in private draft
        run: |
          metadata="$RUNNER_TEMP/Jarvis_${APP_VERSION}_ios_arm64.testflight.json"
          printf '{"bundle_id":"com.hawkeynl.jarvis","build_number":"%s","distribution":"testflight","version":"%s"}\n' \
            "$IOS_BUILD_NUMBER" "$APP_VERSION" > "$metadata"
          gh release upload "$RELEASE_TAG" "$metadata" --repo "$PRIVATE_RELEASE_REPO" --clobber
      - name: Remove ephemeral Apple signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/jarvis-release.keychain-db" 2>/dev/null || true
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/Jarvis-CI.mobileprovision"
          rm -f "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP"/AuthKey_*.p8

  publish-private-release:
    name: Publish complete private manifest
    needs: [validate, desktop, android, ios]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: private-app-release
    env:
      ANDROID_VERSION_CODE: ${{ inputs.android_version_code }}
      APP_VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ secrets.PRIVATE_RELEASE_REPO_TOKEN }}
      IOS_BUILD_NUMBER: ${{ inputs.ios_build_number }}
      RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
      RELEASED_AT: ${{ needs.validate.outputs.released_at }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Download staged assets from private storage
        run: gh release download "$RELEASE_TAG" --repo "$PRIVATE_RELEASE_REPO" --dir "$RUNNER_TEMP/private-assets"
      - name: Build and validate storage-neutral release manifest
        run: |
          python3 jarvis-app/update-release/create_descriptor.py \
            --assets "$RUNNER_TEMP/private-assets" \
            --version "$APP_VERSION" \
            --released-at "$RELEASED_AT" \
            --android-version-code "$ANDROID_VERSION_CODE" \
            --ios-build-number "$IOS_BUILD_NUMBER" \
            --output "$RUNNER_TEMP/private-assets/descriptor.json"
          python3 jarvis-app/update-release/build_manifest.py \
            --descriptor "$RUNNER_TEMP/private-assets/descriptor.json" \
            --output "$RUNNER_TEMP/latest.json"
          cp "$RUNNER_TEMP/latest.json" "$RUNNER_TEMP/Jarvis_${APP_VERSION}_manifest_v1.json"
      - name: Atomically publish complete private release
        run: |
          gh release upload "$RELEASE_TAG" \
            "$RUNNER_TEMP/latest.json" \
            "$RUNNER_TEMP/Jarvis_${APP_VERSION}_manifest_v1.json" \
            --repo "$PRIVATE_RELEASE_REPO" \
            --clobber
          gh release edit "$RELEASE_TAG" --repo "$PRIVATE_RELEASE_REPO" --draft=false --latest
