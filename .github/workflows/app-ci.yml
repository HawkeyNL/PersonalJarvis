name: App CI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/app-ci.yml"
      - ".github/workflows/mobile-release.yml"
      - "docs/app-updates/**"
      - "tools/app-updates/**"
      - "jarvis-ios/**"
      - "jarvis-android/**"
      - "deploy/app-updates/**"
      - "crates/client-core/**"
      - "crates/identity/**"
      - "jarvis-api/**"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    paths:
      - ".github/workflows/app-ci.yml"
      - ".github/workflows/mobile-release.yml"
      - "docs/app-updates/**"
      - "tools/app-updates/**"
      - "jarvis-ios/**"
      - "jarvis-android/**"
      - "deploy/app-updates/**"
      - "crates/client-core/**"
      - "crates/identity/**"
      - "jarvis-api/**"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

concurrency:
  group: app-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  client-contract:
    name: Shared client protocol
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format shared client code
        run: cargo fmt -p jarvis-client-core -p jarvis-identity -p jarvis-api -- --check
      - name: Test shared client protocol
        run: cargo test -p jarvis-client-core -p jarvis-identity -p jarvis-api
      - name: Lint shared client protocol
        run: cargo clippy -p jarvis-client-core -p jarvis-identity -p jarvis-api --all-targets -- -D warnings

  mirror:
    name: Home Node application mirror
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install --yes minisign age
      - run: |
          python3 -m unittest discover -s tools/app-updates/update-release/tests -v
          python3 -m unittest discover -s tools/app-updates/update-mirror/tests -v
          bash deploy/app-updates/tests/test-app-update-assets.sh

  ios:
    name: iOS simulator
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    defaults:
      run:
        working-directory: jarvis-ios
    steps:
      - uses: actions/checkout@v5
      - name: Record Apple toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          xcrun simctl list devices available
      - name: Build unsigned simulator app
        run: |
          xcodebuild \
            -project Jarvis.xcodeproj \
            -scheme Jarvis \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/JarvisDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
      - name: Run unsigned simulator tests
        run: |
          xcodebuild \
            -project Jarvis.xcodeproj \
            -scheme Jarvis \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -derivedDataPath "$RUNNER_TEMP/JarvisDerivedData" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test

  android:
    name: Android debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: jarvis-android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: |
            jarvis-android/*.gradle.kts
            jarvis-android/gradle/libs.versions.toml
            jarvis-android/gradle/wrapper/gradle-wrapper.properties
            jarvis-android/app/build.gradle.kts
      - uses: android-actions/setup-android@v3
      - name: Install compile SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - name: Test, lint and build debug APK
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon
      - uses: actions/upload-artifact@v6
        with:
          name: jarvis-android-debug-${{ github.sha }}
          path: jarvis-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
