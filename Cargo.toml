[workspace]
resolver = "2"
members = [
    "services/api",
    "crates/config",
    "crates/observability",
]

[workspace.package]
edition = "2021"
rust-version = "1.80"

[workspace.dependencies]
# async runtime + web
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["trace", "cors"] }

# database
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "postgres",
    "macros",
    "migrate",
] }

# serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# config
figment = { version = "0.10", features = ["toml", "env"] }
dotenvy = "0.15"

# errors
anyhow = "1"

# logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }

# internal crates
jarvis-config = { path = "crates/config" }
jarvis-observability = { path = "crates/observability" }
