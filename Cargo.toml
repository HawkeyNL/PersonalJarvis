[workspace]
resolver = "2"
members = [
    "services/api",
    "crates/config",
    "crates/observability",
    "crates/identity",
]
# The Tauri client crate builds via its own tooling (npm run tauri ...) and is
# intentionally excluded so backend CI (clippy -D warnings) stays fast and the
# heavy tauri/wry deps don't enter the workspace graph.
exclude = [
    "apps/client/src-tauri",
]

[workspace.package]
edition = "2021"
rust-version = "1.80"

[workspace.dependencies]
# async runtime + web
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["trace", "cors"] }

# database
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "postgres",
    "macros",
    "migrate",
    "uuid",
    "time",
] }

# serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# config
figment = { version = "0.10", features = ["toml", "env"] }
dotenvy = "0.15"

# errors
anyhow = "1"
thiserror = "1"

# ids and time
uuid = { version = "1", features = ["v7", "serde"] }
time = { version = "0.3", features = ["serde"] }

# crypto (device-bound auth)
ed25519-dalek = "2"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"

# logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }

# internal crates
jarvis-config = { path = "crates/config" }
jarvis-observability = { path = "crates/observability" }
