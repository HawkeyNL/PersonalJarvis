[package]
name = "jarvis-api"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
# Real STT (whisper.cpp). Requires cmake + a C++ toolchain. Run the backend with
# `cargo run -p jarvis-api --features speech-whisper` and set JARVIS_SPEECH_*.
speech-whisper = ["jarvis-speech/whisper"]

[lib]
name = "jarvis_api"
path = "src/lib.rs"

[[bin]]
name = "jarvis-api"
path = "src/main.rs"

[dependencies]
tokio.workspace = true
axum.workspace = true
tower-http.workspace = true
sqlx.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
dotenvy.workspace = true
hex.workspace = true
uuid.workspace = true
tracing.workspace = true
jarvis-config.workspace = true
jarvis-observability.workspace = true
jarvis-identity.workspace = true
jarvis-portfolio.workspace = true
jarvis-ibkr.workspace = true
jarvis-llm.workspace = true
jarvis-speech.workspace = true
jarvis-registry.workspace = true
jarvis-usage.workspace = true
jarvis-orchestrator.workspace = true
jarvis-agent.workspace = true
rust_decimal.workspace = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
ed25519-dalek.workspace = true
rand.workspace = true
